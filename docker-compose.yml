version: '3.8'

services:
  express-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express-app
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://expressuser:expresspass@postgres:5432/expressdb}
    networks:
      - express-network

networks:
  express-network:
    driver: bridge
